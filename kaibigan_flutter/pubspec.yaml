name: kaibigan_flutter
description: Kaibigan - An AI-Assisted Localized Mental Wellness Companion for Filipinos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & Environment
  supabase_flutter: ^2.8.0

  # State Management
  provider: ^6.1.2

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.0
  flutter_markdown: ^0.7.5

  # Utilities & Networking
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

  # Document Generation & Notifications
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/feature icons/
    - assets/mood tracker/
    - assets/sleep log/
