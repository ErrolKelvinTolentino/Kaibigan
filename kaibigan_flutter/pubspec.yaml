name: kaibigan_flutter
description: Kaibigan - An AI-Assisted Localized Mental Wellness Companion for Filipinos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & Environment
  supabase_flutter: ^2.8.0
  supabase: ^2.16.1

  # State Management
  provider: ^6.1.2

  # UI, Fonts & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.0
  flutter_markdown: ^0.7.5

  # Audio
  audioplayers: ^6.1.0

  # Utilities & Networking
  http: ^1.2.2
  xml: ^7.0.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

  # Document Generation & Notifications
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_local_notifications: ^18.0.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Kaibigan Logo.png"
  adaptive_icon_background: "#FFD21F"
  adaptive_icon_foreground: "assets/Kaibigan Logo.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  background_color_ios: "#FFD21F"

flutter_native_splash:
  color: "#FFF9ED"
  color_dark: "#1F211F"
  image: "assets/Kaibigan Logo.png"
  image_dark: "assets/Kaibigan Logo.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#FFF9ED"
    color_dark: "#1F211F"
    image: "assets/Kaibigan Logo.png"
    image_dark: "assets/Kaibigan Logo.png"
    icon_background_color: "#FFF9ED"
    icon_background_color_dark: "#1F211F"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/Kaibigan Logo.png
    - assets/feature icons/
    - assets/mood tracker/
    - assets/sleep log/
    - assets/gratitude garden assets/
    - assets/breathing sounds/
    - assets/ui sounds/
